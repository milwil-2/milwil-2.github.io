        // last gives their average instead.)
        function handSpeed(samples) {
          const last = samples[samples.length - 1];
          const recent = samples.filter((sample) => last.time - sample.time <= THROW_WINDOW);
          const first = recent[0];
          if (recent.length < 2 || last.time - first.time < THROW_SPAN) return { x: 0, y: 0 };
          const speedX = speedAtEnd(recent, "x");
          const speedY = speedAtEnd(recent, "y");
          // A fitted curve can turn back at its very end; the hand never goes against the drag.
          if (speedX * (last.x - first.x) + speedY * (last.y - first.y) < 0) return { x: 0, y: 0 };
          return { x: speedX, y: speedY };
        }

        // Least squares for position = a + b·t + c·t², with t in seconds and 0 at the last sample,
        // so b is the speed there. Too few samples for a curve get a straight line.
        function speedAtEnd(samples, key) {
          const end = samples[samples.length - 1];
          const t = [0, 0, 0, 0, 0]; // sums of time to the powers 0 to 4
          const p = [0, 0, 0]; // sums of position times time to the powers 0 to 2
          for (const sample of samples) {
            const time = (sample.time - end.time) / 1000;
            const position = sample[key] - end[key];
            for (let i = 0, power = 1; i < 5; i++, power *= time) {
              t[i] += power;
              if (i < 3) p[i] += position * power;
            }
          }
          const line = (t[0] * p[1] - t[1] * p[0]) / (t[0] * t[2] - t[1] * t[1]);
          if (samples.length < 3) return line;
          const det =
            t[0] * (t[2] * t[4] - t[3] * t[3]) -
            t[1] * (t[1] * t[4] - t[3] * t[2]) +
            t[2] * (t[1] * t[3] - t[2] * t[2]);
          if (!(Math.abs(det) > 1e-18)) return line;
          return (
            (t[0] * (p[1] * t[4] - t[3] * p[2]) -
              p[0] * (t[1] * t[4] - t[3] * t[2]) +
              t[2] * (t[1] * p[2] - p[1] * t[2])) /
            det
          );
        }

        // Letting go leaves the triangle moving and turning as the hand had it; a tap pokes it. In
        // the game, letting go putts. A drag that ends any other way (cancelled, its capture lost, its
        // button up unseen) is let go without a poke or a putt.
        function letGo(event) {
          if (game.aim && event.pointerId === game.aim.pointerId) {
            if (event.type === "pointerup") shoot();
            else game.aim = null;
            return;
          }
          if (!held || event.pointerId !== held.pointerId) return;
          if (event.type === "pointerup" && held.travelled < 6 && event.timeStamp - held.downTime < 300) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const spotX = x + zoom * (cos * held.localX - sin * held.localY);
            const spotY = y + zoom * (sin * held.localX + cos * held.localY);
            poke(spotX, spotY);
          }
          const speed = Math.hypot(vx, vy);
          if (speed > MAX_THROW) {
            vx *= MAX_THROW / speed;
            vy *= MAX_THROW / speed;
          }
          held = null;
          stage.classList.remove("is-holding");
        }

        stage.addEventListener("pointerup", letGo);
        stage.addEventListener("pointercancel", letGo);
        stage.addEventListener("lostpointercapture", letGo);

        // A scroll or trackpad swipe sets the triangle spinning; in the game it stays as putted.
        stage.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            if (inPlay()) return;
            const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
            const turn = -(event.deltaY + event.deltaX) * unit;
            asleep = false;
            if (reducedMotion.matches) {
              angle += turn * 0.2 * DEG;
              dirty = true;
            } else {
              // Blended in over a moment, so a mouse wheel's notches turn it smoothly too.
              spinKick = clamp(spin + spinKick + turn * 1.2 * DEG, -MAX_SPIN * DEG, MAX_SPIN * DEG) - spin;
            }
          },
          { passive: false },
        );

        dropButton.addEventListener("click", () => setDropped(!dropped));
        playButton.addEventListener("click", startGame);
        againButton.addEventListener("click", startGame);
        quitButton.addEventListener("click", endGame);
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && game.state !== "off") endGame();
        });

        let previous = null;
        function frame(now) {
          if (previous === null) previous = now;
          // A tab coming back after a while carries on where it was rather than catching up.
          const seconds = clamp((now - previous) / 1000, 0, 0.1);
          previous = now;
          frameTime = now;
          // Nothing moves until the triangle has been laid out.
          if (glyphs.length) {
            // Each frame moves everything on by exactly the time since the last one, in equal
            // slices no longer than STEP, so the motion stays even at any refresh rate.
            const slices = Math.ceil(seconds / STEP);
            for (let i = 0; i < slices; i++) step(seconds / slices, (i + 1) / slices);
            if (held) {
              held.fromX = held.targetX;
              held.fromY = held.targetY;
            }
            updateCursor();
            if (dirty || !isStill()) {
              render();
              dirty = false;
            }
          }
          requestAnimationFrame(frame);
        }

        let resizing = false;
        window.addEventListener("resize", () => {
          if (resizing) return;
          resizing = true;
          requestAnimationFrame(() => {
            resizing = false;
            layout();
          });
        });

        // Moving the window to a screen with a different pixel density redraws the canvas for it.
        function watchPixelRatio() {
          const query = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
          query.addEventListener(
            "change",
            () => {
              layout();
              watchPixelRatio();
            },
            { once: true },
          );
        }

        layout();
        watchPixelRatio();
        if (document.fonts) document.fonts.ready.then(layout);
        document.documentElement.classList.add("is-ready");
        // Show the links and controls for a moment on arrival, so visitors know they are there.
        showControls();

        if (!reducedMotion.matches) {
          // Out of the corner: down and to the right.
          const heading = (Math.PI / 180) * (25 + Math.random() * 40);
          vx = Math.cos(heading) * DRIFT;
          vy = Math.sin(heading) * DRIFT;
          spin = IDLE_SPIN * DEG;
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
